# Builds BootstrapMate and publishes two assets:
#
#   BootstrapMate-<version>.pkg         unsigned, built exactly as before.
#   BootstrapMate-<version>-signed.pkg  a copy of the same payload signed with a
#                                       Developer ID, notarized and stapled, for
#                                       anyone installing directly.
#
# The unsigned pkg is kept, unchanged, for the downstream pipeline described
# below: it downloads BootstrapMate-*.pkg and skips any name containing
# "-signed", so the signed asset does not alter what it receives.
#
# This public repo holds NO Apple Developer ID -- the pkg ships unsigned and
# un-notarized. The ECU Munki bootstrap pipeline (private Azure DevOps) pulls
# this release via `gh release download`, then deep-signs the inner app/Mach-O
# with the Developer ID Application cert, productsigns the pkg with the
# Developer ID Installer cert, notarizes, and staples -- so signing only ever
# happens inside that private/internal pipeline.
#
# The assembly mirrors the Makefile's build (CLI + GUI + Helper binaries, icon,
# LaunchDaemons, relocation-disabled pkg) MINUS every codesign/notarize step.
# The Makefile remains the local signed-build tool and is not used here.
#
# Run manually via the Actions tab, or trigger by pushing a tag like
# v2026.06.10.1430. Tagging a new version is the only step needed to roll a new
# BootstrapMate to the fleet (the Munki pipeline picks up `latest` on its next run).

name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build unsigned + signed pkgs, publish
    runs-on: macos-26
    permissions:
      contents: write
    # Notarization for a young team can sit in Apple's queue for over an hour.
    timeout-minutes: 330
    env:
      NOTARIZATION_PROFILE: notary
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select Xcode (26.x for the macOS 26 Liquid Glass SDK)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Show Swift version
        run: swift --version

      - name: Resolve version from tag
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="$(date '+%Y.%m.%d.%H%M')"
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building BootstrapMate $VERSION"

      - name: Build Swift binaries (release, universal)
        run: |
          set -euo pipefail
          swift package resolve
          swift build -c release --arch arm64 --arch x86_64

      - name: Assemble unsigned pkg (CLI + GUI + Helper + icon)
        id: pkg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          # Split VERSION (2026.06.10.1430) -> marketing 2026.06.10 + build 1430.
          MARKETING_VERSION="${VERSION%.*}"
          BUILD_NUMBER="${VERSION##*.}"

          BUILD_DIR=build
          PKG_ROOT="$BUILD_DIR/pkg-root"
          PACKAGING_DIR=packaging
          SWIFT_REL=.build/apple/Products/Release
          ACTOOL_OUT="$BUILD_DIR/actool-out"
          APP="$PKG_ROOT/Applications/Utilities/BootstrapMate.app"
          APP_MACOS="$APP/Contents/MacOS"
          APP_RES="$APP/Contents/Resources"
          APP_HELPER_LD="$APP/Contents/Library/LaunchDaemons"

          rm -rf "$BUILD_DIR"
          mkdir -p "$APP_MACOS" "$APP_RES" "$APP_HELPER_LD" \
                   "$PKG_ROOT/Library/LaunchDaemons" "$BUILD_DIR/scripts" \
                   "$PKG_ROOT/usr/local/bootstrapmate" "$ACTOOL_OUT"

          # Binaries (NO codesign -- the Munki pipeline signs downstream).
          cp "$SWIFT_REL/bootstrapmate"        "$APP_MACOS/managedbootstrapinstall"
          cp "$SWIFT_REL/BootstrapMateApp"     "$APP_MACOS/BootstrapMateGUI"
          cp "$SWIFT_REL/BootstrapMateHelper"  "$APP_MACOS/BootstrapMateHelper"
          chmod 755 "$APP_MACOS/managedbootstrapinstall" "$APP_MACOS/BootstrapMateGUI" "$APP_MACOS/BootstrapMateHelper"

          # Info.plist (version placeholders).
          sed -e "s/{{MARKETING_VERSION}}/$MARKETING_VERSION/g" \
              -e "s/{{BUILD_NUMBER}}/$BUILD_NUMBER/g" \
              "$PACKAGING_DIR/resources/Info.plist.template" > "$APP/Contents/Info.plist"

          # Icon: Assets.car (macOS 26+ Liquid Glass) + .icns fallback (13-25).
          xcrun actool \
            --compile "$ACTOOL_OUT" \
            --platform macosx \
            --minimum-deployment-target 13.0 \
            --app-icon BootstrapMate \
            --output-partial-info-plist "$ACTOOL_OUT/partial-info.plist" \
            --warnings --errors \
            resources/BootstrapMate.icon > /dev/null
          cp "$ACTOOL_OUT/Assets.car"        "$APP_RES/Assets.car"
          cp "$ACTOOL_OUT/BootstrapMate.icns" "$APP_RES/BootstrapMate.icns"

          # LaunchDaemons + postinstall.
          cp "$PACKAGING_DIR/LaunchDaemons/com.github.bootstrapmate.plist"        "$PKG_ROOT/Library/LaunchDaemons/"
          cp "$PACKAGING_DIR/LaunchDaemons/com.github.bootstrapmate.helper.plist" "$APP_HELPER_LD/"
          cp "$PACKAGING_DIR/scripts/postinstall" "$BUILD_DIR/scripts/"
          chmod +x "$BUILD_DIR/scripts/postinstall"
          touch "$PKG_ROOT/usr/local/bootstrapmate/.placeholder"

          # pkgbuild with relocation + version-check disabled (mirrors the Makefile).
          pkgbuild --analyze --root "$PKG_ROOT" "$BUILD_DIR/component.plist"
          /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false"   "$BUILD_DIR/component.plist"
          /usr/libexec/PlistBuddy -c "Set :0:BundleIsVersionChecked false" "$BUILD_DIR/component.plist"
          PKG="$BUILD_DIR/BootstrapMate-${VERSION}.pkg"
          pkgbuild \
            --root "$PKG_ROOT" \
            --component-plist "$BUILD_DIR/component.plist" \
            --identifier com.github.bootstrapmate \
            --version "$VERSION" \
            --scripts "$BUILD_DIR/scripts" \
            "$PKG"

          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "--- built (unsigned) ---"
          ls -lh "$PKG"
          pkgutil --payload-files "$PKG" | grep -E 'BootstrapMate(GUI|Helper)|managedbootstrapinstall' || true

      - name: Import Developer ID certificates
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certs.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/certs.p12"

      - name: Store notarization credentials
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$key"
          xcrun notarytool store-credentials "$NOTARIZATION_PROFILE" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN"
          rm "$key"

      # Signs a copy of the payload the unsigned step assembled, so both pkgs
      # carry identical files. Mirrors the Makefile's sign-binaries, sign-app
      # and sign-pkg targets.
      - name: Assemble signed pkg
        id: signed
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SIGNING_IDENTITY_APP: ${{ secrets.SIGNING_IDENTITY_APP }}
          SIGNING_IDENTITY_PKG: ${{ secrets.SIGNING_IDENTITY_INSTALLER }}
        run: |
          set -euo pipefail
          BUILD_DIR=build
          ROOT="$BUILD_DIR/pkg-root-signed"
          rm -rf "$ROOT"
          ditto "$BUILD_DIR/pkg-root" "$ROOT"
          APP="$ROOT/Applications/Utilities/BootstrapMate.app"
          sign() { codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" \
                     --sign "$SIGNING_IDENTITY_APP" "$@"; }
          # BootstrapMateGUI is the bundle's main executable, so signing it signs
          # the bundle, which needs every other executable in it signed first.
          sign --identifier com.github.bootstrapmate.managedbootstrapinstall "$APP/Contents/MacOS/managedbootstrapinstall"
          sign --identifier com.github.bootstrapmate.helper "$APP/Contents/MacOS/BootstrapMateHelper"
          sign --identifier com.github.bootstrapmate.gui    "$APP/Contents/MacOS/BootstrapMateGUI"
          sign --deep "$APP"
          codesign --verify --strict --deep --verbose=2 "$APP"

          UNSIGNED="$BUILD_DIR/BootstrapMate-${VERSION}-signed.unsigned.pkg"
          PKG="$BUILD_DIR/BootstrapMate-${VERSION}-signed.pkg"
          pkgbuild \
            --root "$ROOT" \
            --component-plist "$BUILD_DIR/component.plist" \
            --identifier com.github.bootstrapmate \
            --version "$VERSION" \
            --scripts "$BUILD_DIR/scripts" \
            "$UNSIGNED"
          productsign --sign "$SIGNING_IDENTITY_PKG" --timestamp --keychain "$KEYCHAIN" "$UNSIGNED" "$PKG"
          rm "$UNSIGNED"
          pkgutil --check-signature "$PKG"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple
        env:
          PKG: ${{ steps.signed.outputs.pkg }}
        run: |
          set -euo pipefail
          id=$(xcrun notarytool submit "$PKG" --keychain-profile "$NOTARIZATION_PROFILE" \
                 --keychain "$KEYCHAIN" --output-format json | jq -r .id)
          echo "Submitted $(basename "$PKG") as $id"
          deadline=$((SECONDS + 5 * 3600))
          while :; do
            status=$(xcrun notarytool info "$id" --keychain-profile "$NOTARIZATION_PROFILE" \
                       --keychain "$KEYCHAIN" --output-format json | jq -r .status)
            echo "$(date -u +%H:%M:%S) $status"
            case "$status" in
              Accepted) break ;;
              Invalid|Rejected)
                xcrun notarytool log "$id" --keychain-profile "$NOTARIZATION_PROFILE" --keychain "$KEYCHAIN"
                exit 1 ;;
            esac
            if [ "$SECONDS" -gt "$deadline" ]; then
              echo "::error::Still $status after 5 hours. Check later with: xcrun notarytool info $id"
              exit 1
            fi
            sleep 30
          done
          xcrun stapler staple "$PKG"
          spctl -a -vvv -t install "$PKG"

      - name: Upload pkg artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BootstrapMate-${{ steps.ver.outputs.version }}-pkg
          path: |
            ${{ steps.pkg.outputs.pkg }}
            ${{ steps.signed.outputs.pkg }}

      - name: Publish GitHub release (unsigned + signed pkgs)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          PKG: ${{ steps.pkg.outputs.pkg }}
          SIGNED_PKG: ${{ steps.signed.outputs.pkg }}
        run: |
          set -euo pipefail
          AUTO_NOTES=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG_NAME" --jq .body)
          AUTO_NOTES=$(printf '%s\n' "$AUTO_NOTES" | sed -E -e 's/ by @[A-Za-z0-9_-]+ in / in /g' -e '/^#+ New Contributors/d' -e '/made their first contribution/d')
          NOTES=$(printf '%s\n\n%s\n' "Install **$(basename "$SIGNED_PKG")**: signed with a Developer ID and notarized by Apple. The unsigned pkg beside it is for pipelines that re-sign with their own identity." "$AUTO_NOTES")
          gh release create "$TAG_NAME" "$PKG" "$SIGNED_PKG" \
            --title "$TAG_NAME" \
            --notes "$NOTES"
